name: collect-bounty-cycle

# 每 10 分钟轮询一次；窗口变了才落一条数据（150 分钟一轮，10 分钟足够覆盖）。
# 也可在 Actions 页面手动 Run workflow，用来验证公开端点是否放行云端 IP。
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'collector.mjs'
      - '.github/workflows/collect.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-bounty-cycle
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe endpoints
        run: |
          echo "== official =="
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" -A "voxalic-bounty-collector/1.0" https://api.warframe.com/cdn/worldState.php || true
          echo "== oracle =="
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" -A "voxalic-bounty-collector/1.0" https://oracle.browse.wf/bounty-cycle || true
          echo "egress-ip: $(curl -s https://api.ipify.org || true)"

      - name: Collect window
        run: |
          mkdir -p data
          if node collector.mjs > /tmp/collect.log 2>&1; then
            echo "collect: ok"
            cat /tmp/collect.log
            rm -f data/last-error.log
          else
            echo "collect: failed"
            cat /tmp/collect.log
            {
              echo "$(date -u +%FT%TZ) egress=$(curl -s https://api.ipify.org || true)"
              cat /tmp/collect.log
            } > data/last-error.log
            exit 1
          fi

      - name: Commit new window
        if: always()
        run: |
          if [ ! -d data ]; then echo "no data dir"; exit 0; fi
          git config user.name "bounty-collector"
          git config user.email "bounty-collector@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new window"
            exit 0
          fi
          git commit -m "data: window $(date -u +%FT%TZ)"
          git push
